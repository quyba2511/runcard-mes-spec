services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mes
    volumes:
      - mes-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/seed_demo.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./db/002_runtime.sql:/docker-entrypoint-initdb.d/003_runtime.sql:ro
      - ./db/003_mes_extensions.sql:/docker-entrypoint-initdb.d/004_mes_extensions.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mes -d mes']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql://mes:${POSTGRES_PASSWORD}@db:5432/mes
      SEED_DEMO_ACCOUNTS: 'true'
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      ERP_WEBHOOK_URL: ${ERP_WEBHOOK_URL:-}
      ERP_WEBHOOK_TOKEN: ${ERP_WEBHOOK_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, app.worker]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['${HTTP_PORT:-8080}:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mes-data:
